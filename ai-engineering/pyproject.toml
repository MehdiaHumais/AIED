[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aied"
version = "0.1.0"
description = "Britsync AI Engineering Department - Autonomous Multi-Agent Software Engineering Platform"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Britsync", email = "engineering@britsync.com"}
]

dependencies = [
    # Backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",

    # AI / Agent Framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",

    # LLM Clients
    "openai>=1.50.0",
    "anthropic>=0.34.0",

    # Memory
    "qdrant-client>=1.11.0",

    # Tools
    "playwright>=1.47.0",
    "gitpython>=3.1.0",
    "docker>=7.1.0",

    # Utilities
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "croniter>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "apps*", "llms*", "memory*", "shared*", "tools*"]
exclude = ["docker*", "scripts*", "workflows*", "prompts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
